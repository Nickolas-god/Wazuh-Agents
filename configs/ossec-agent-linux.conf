<!--
  Wazuh - Agent - Configuração padrão S3 para Linux
  FIM em tempo real com whodata, coleta de auditd, SCA (CIS Benchmarks)

  ATENÇÃO: antes de usar, substitua o placeholder abaixo pelo IP real
  do Wazuh Manager da empresa/cliente.
-->

<ossec_config>

  <!-- ==================== CLIENT / SERVER ====================
       SUBSTITUA "IP_DO_WAZUH_MANAGER" pelo IP real do Manager. -->
  <client>
    <server>
      <address>IP_DO_WAZUH_MANAGER</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <crypto_method>aes</crypto_method>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
    <auto_restart>yes</auto_restart>
  </client>

  <!-- ==================== AGENT BUFFER ==================== -->
  <client_buffer>
    <disabled>no</disabled>
    <queue_size>5000</queue_size>
    <events_per_second>500</events_per_second>
  </client_buffer>

  <!-- ==================== LOG ANALYSIS ==================== -->

  <!-- Logs de autenticação (SSH, sudo, login) -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>

  <!-- Log geral do sistema (Debian/Ubuntu) -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/syslog</location>
  </localfile>

  <!-- Log geral do sistema (RHEL/CentOS) -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/messages</location>
  </localfile>

  <!-- Eventos do auditd (requer auditd instalado e audit.rules aplicado) -->
  <localfile>
    <log_format>audit</log_format>
    <location>/var/log/audit/audit.log</location>
  </localfile>

  <!-- Log do Docker, se aplicável -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/docker.log</location>
  </localfile>

  <!-- Active response log -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/ossec/logs/active-responses.log</location>
  </localfile>

  <!-- ==================== ROOTCHECK ==================== -->
  <rootcheck>
    <disabled>no</disabled>
    <check_files>yes</check_files>
    <check_trojans>yes</check_trojans>
    <check_dev>yes</check_dev>
    <check_sys>yes</check_sys>
    <check_pids>yes</check_pids>
    <check_ports>yes</check_ports>
    <check_if>yes</check_if>
    <frequency>43200</frequency>
    <rootkit_files>etc/shared/rootkit_files.txt</rootkit_files>
    <rootkit_trojans>etc/shared/rootkit_trojans.txt</rootkit_trojans>
  </rootcheck>

  <!-- ==================== SCA (CIS Benchmarks) ==================== -->
  <sca>
    <enabled>yes</enabled>
    <scan_on_start>yes</scan_on_start>
    <interval>12h</interval>
    <skip_nfs>yes</skip_nfs>
  </sca>

  <!-- ==================== FILE INTEGRITY MONITORING ==================== -->
  <syscheck>

    <disabled>no</disabled>
    <frequency>43200</frequency>
    <scan_on_start>yes</scan_on_start>
    <alert_new_files>yes</alert_new_files>

    <!-- ── WHODATA: sabe QUEM alterou, não só O QUE mudou (requer auditd) ── -->
    <directories whodata="yes" check_all="yes" report_changes="yes">/etc</directories>
    <directories whodata="yes" check_all="yes" report_changes="yes">/usr/bin</directories>
    <directories whodata="yes" check_all="yes" report_changes="yes">/usr/sbin</directories>
    <directories whodata="yes" check_all="yes">/bin</directories>
    <directories whodata="yes" check_all="yes">/sbin</directories>
    <directories whodata="yes" check_all="yes">/boot</directories>

    <!-- ── Pastas de usuário e persistência ── -->
    <directories check_all="yes" realtime="yes" report_changes="yes">/root</directories>
    <directories check_all="yes" realtime="yes">/home</directories>
    <directories check_all="yes" realtime="yes">/tmp</directories>
    <directories check_all="yes" realtime="yes">/var/tmp</directories>

    <!-- ── Diz ao Wazuh pra usar os eventos do auditd já filtrados por key ── -->
    <directories whodata="yes" audit_key="rootcmd,priv_esc,user_modification">/etc/passwd</directories>

    <!-- ── IGNORE: caminhos ruidosos ── -->
    <ignore>/etc/mtab</ignore>
    <ignore>/etc/hosts.deny</ignore>
    <ignore>/etc/mail/statistics</ignore>
    <ignore>/etc/random-seed</ignore>
    <ignore>/etc/random.seed</ignore>
    <ignore>/etc/adjtime</ignore>
    <ignore>/etc/httpd/logs</ignore>
    <ignore>/etc/utmpx</ignore>
    <ignore>/etc/wtmpx</ignore>
    <ignore>/etc/cups/certs</ignore>
    <ignore>/etc/dumpdates</ignore>
    <ignore>/etc/svc/volatile</ignore>
    <ignore type="sregex">.log$|.swp$</ignore>

    <!-- Sincronização com o manager -->
    <synchronization>
      <enabled>yes</enabled>
      <interval>5m</interval>
      <max_eps>10</max_eps>
    </synchronization>

  </syscheck>

  <!-- ==================== SYSCOLLECTOR ==================== -->
  <wodle name="syscollector">
    <disabled>no</disabled>
    <interval>1h</interval>
    <scan_on_start>yes</scan_on_start>
    <hardware>yes</hardware>
    <os>yes</os>
    <network>yes</network>
    <packages>yes</packages>
    <ports all="yes">yes</ports>
    <processes>yes</processes>

    <synchronization>
      <max_eps>10</max_eps>
    </synchronization>
  </wodle>

  <!-- ==================== VULNERABILITY DETECTION ==================== -->
  <!-- Requer habilitação correspondente no Manager -->
  <wodle name="vulnerability-detection">
    <enabled>yes</enabled>
  </wodle>

  <!-- ==================== ACTIVE RESPONSE ==================== -->
  <active-response>
    <disabled>no</disabled>
    <ca_store>wpk_root.pem</ca_store>
    <ca_verification>yes</ca_verification>
  </active-response>

  <!-- ==================== LOGGING ==================== -->
  <logging>
    <log_format>plain</log_format>
  </logging>

</ossec_config>
